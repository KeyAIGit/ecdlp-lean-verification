name: Docs sync

# Makes doc-drift structurally impossible. Almost every derived artifact in the repo is a
# pure function of a small set of committed sources (VERIFIED.md, the claim corpus, and the
# generator scripts). This workflow regenerates ALL of them with the repo's own scripts,
# runs the count-consistency gate, and then:
#   - on push to main / manual dispatch: auto-commits any regenerated file with [skip ci];
#   - on a pull request: FAILS if regeneration changed a PURE artifact, so drift is caught
#     in review instead of being silently committed.
#
# SUPERSEDES stats.yml: this is a strict superset (it regenerates stats.json + badge +
# dashboard as well), so stats.yml was retired to avoid two workflows racing to push.
#
# The public site generator is deterministic. Machine-readable views, all five site pages,
# and the search-engine discovery files are regenerated and drift-gated together on pull requests.
#
# Derived files (never hand-edit — regenerate via the scripts below):
#   PURE  (drift-gated on PRs):
#     data/stats.json, badges/theorems.json   (gen_stats.py)
#     data/frontier_map.json                   (build_frontier_map.py)
#     data/knowledge_graph.json, .md           (build_knowledge_graph.py)
#     COVERAGE.md                              (coverage_report.py)
#     STATUS.md                                (gen_status.py)
#     data/result_registry.json                (gen_result_registry.py)
#     data/researchos_result_registry.json     (gen_researchos_registry.py)
#     data/verified_index.json, VERIFIED_INDEX.md, llms.txt (gen_verified_index.py)
#     Ecdlp/LedgerAxiomAudit.lean              (gen_axiom_audit.py)
#     ResearchOS/LedgerAxiomAudit.lean         (gen_axiom_audit.py)
#     data/source_registry.json                (gen_source_registry.py)
#     data/typed_evidence_state.json           (build_typed_evidence_state.py)
#     data/research_claim_state.json            (research_claims.py)
#     data/research_engine_state.json          (build_research_engine_state.py)
#     data/research_engine_v02_state.json      (build_research_engine_v02_state.py)
#     data/research_engine_shadow_intake.json  (build_research_shadow_intake.py)
#     data/untrusted_evidence_intake/*.json     (build_untrusted_evidence_intake.py)
#     data/hypothesis_funnel_state.json        (hypothesis_funnel.py)
#     data/hypothesis_space_state.json         (hypothesis_space_funnel.py)
#     data/hypothesis_space_map.json           (hypothesis_space_funnel.py)
#     data/hypothesis_space_run_state.json     (hypothesis_space_run_ledger.py)
#     data/hypothesis_space_campaign_state.json (hypothesis_space_campaign.py)
#     data/hypothesis_ranker_state.json        (hypothesis_ranker.py)
#     repo/ECDLP_DECISION_SUBSTRATE.md         (build_ecdlp_decision_view.py)
#     bundles/MANIFEST.json                    (export_agent_bundle.py)
#     dashboard.html, index.html, results.html, explore.html, pilot.html,
#     robots.txt, sitemap.xml                    (build_dashboard.py -> site_generator.py)

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'VERIFIED.md'
      - 'VERIFIED_RESEARCHOS.md'
      - 'data/KG_CLAIM_FORMALIZATION_v1.csv'
      - 'data/result_registry.json'
      - 'data/researchos_result_registry.json'
      - 'data/verified_index.json'
      - 'data/corpus_coverage_overrides.json'
      - 'data/untrusted_evidence_intake/**'
      - 'archive/untrusted_intake/**'
      - 'STATUS.md'
      - 'tasks/**'
      - 'experiments/**'
      - 'REPOSITORY_ARCHITECTURE.md'
      - 'ROADMAP.md'
      - 'repo/**'
      - 'scripts/**'
      - 'notes/**'
      - 'domains/**'
      - 'BARRIERS.md'
      - 'PUBLISHABLE_UNITS.md'
      - 'TRUST_REPORT.md'
      - 'ABSTRACT_SCOPE.md'
      - 'notes/FOUNDATIONS.md'
      - 'dashboard.html'
      - 'results.html'
      - 'VERIFIED_INDEX.md'
      - 'llms.txt'
      - 'index.html'
      - 'explore.html'
      - 'pilot.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
      - 'CNAME'
  pull_request:
    paths:
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'VERIFIED.md'
      - 'VERIFIED_RESEARCHOS.md'
      - 'data/KG_CLAIM_FORMALIZATION_v1.csv'
      - 'data/result_registry.json'
      - 'data/researchos_result_registry.json'
      - 'data/verified_index.json'
      - 'data/corpus_coverage_overrides.json'
      - 'data/untrusted_evidence_intake/**'
      - 'archive/untrusted_intake/**'
      - 'STATUS.md'
      - 'tasks/**'
      - 'experiments/**'
      - 'REPOSITORY_ARCHITECTURE.md'
      - 'ROADMAP.md'
      - 'repo/**'
      - 'scripts/**'
      - 'notes/**'
      - 'domains/**'
      - 'BARRIERS.md'
      - 'PUBLISHABLE_UNITS.md'
      - 'TRUST_REPORT.md'
      - 'ABSTRACT_SCOPE.md'
      - 'notes/FOUNDATIONS.md'
      - 'dashboard.html'
      - 'results.html'
      - 'VERIFIED_INDEX.md'
      - 'llms.txt'
      - 'index.html'
      - 'explore.html'
      - 'pilot.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'assets/**'
      - 'CNAME'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync-${{ github.ref }}
  cancel-in-progress: true

env:
  # PURE artifacts — pure functions of committed sources, so regeneration must be a no-op.
  # These are the ones the PR drift gate enforces. Order respects the data-flow:
  # stats.json + frontier_map.json feed STATUS.md, so they are generated first.
  DERIVED_PURE: >-
    data/stats.json
    badges/theorems.json
    data/frontier_map.json
    data/knowledge_graph.json
    data/knowledge_graph.md
    COVERAGE.md
    STATUS.md
    data/result_registry.json
    data/researchos_result_registry.json
    data/verified_index.json
    VERIFIED_INDEX.md
    llms.txt
    Ecdlp/LedgerAxiomAudit.lean
    ResearchOS/LedgerAxiomAudit.lean
    data/source_registry.json
    data/typed_evidence_state.json
    data/research_claim_state.json
    data/research_engine_state.json
    data/research_engine_v02_state.json
    data/research_engine_shadow_intake.json
    data/untrusted_evidence_intake/OPUS-ECDLP-SCREEN-ATLAS-2026-07-26.json
    data/hypothesis_funnel_state.json
    data/hypothesis_space_state.json
    data/hypothesis_space_map.json
    data/hypothesis_space_run_state.json
    data/hypothesis_space_campaign_state.json
    data/hypothesis_ranker_state.json
    repo/ECDLP_DECISION_SUBSTRATE.md
    bundles/MANIFEST.json
    dashboard.html
    index.html
    results.html
    explore.html
    pilot.html
    robots.txt
    sitemap.xml

jobs:
  docs-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Engine validators resolve frozen provenance commits.
          fetch-depth: 0

      # ---- regenerate every derived artifact from its real source, in dependency order ----
      - name: Stats + badge (data/stats.json, badges/theorems.json)
        run: python3 scripts/gen_stats.py
      - name: Frontier map (data/frontier_map.json)
        run: python3 scripts/build_frontier_map.py
      - name: Result registry (data/result_registry.json — Lean decls vs VERIFIED.md citations)
        run: python3 scripts/gen_result_registry.py
      - name: ResearchOS result registry (data/researchos_result_registry.json — VERIFIED_RESEARCHOS.md)
        run: python3 scripts/gen_researchos_registry.py
      - name: Cross-lane verified navigation index
        run: python3 scripts/gen_verified_index.py
      - name: Full-ledger axiom audits (Ecdlp + ResearchOS)
        run: python3 scripts/gen_axiom_audit.py
      - name: Source registry (data/source_registry.json — cited works ↔ docs provenance)
        run: python3 scripts/gen_source_registry.py
      - name: Typed evidence state (claims + properties + mechanism cells)
        run: python3 scripts/build_typed_evidence_state.py
      - name: Claim-level research state
        run: python3 scripts/research_claims.py
      - name: Research Engine state (generation + selection + retained outcomes)
        run: python3 scripts/build_research_engine_state.py
      - name: Research Engine v0.2 lifecycle state
        run: python3 scripts/build_research_engine_v02_state.py
      - name: Research Engine shadow intake
        run: python3 scripts/build_research_shadow_intake.py
      - name: Quarantined untrusted evidence intake
        run: python3 scripts/build_untrusted_evidence_intake.py
      - name: Research-question funnel aggregate
        run: python3 scripts/hypothesis_funnel.py
      - name: Million-cell research-question space
        run: python3 scripts/hypothesis_space_funnel.py
      - name: Immutable hypothesis-space run memory
        run: python3 scripts/hypothesis_space_run_ledger.py
      - name: Finite unique-coverage campaign memory
        run: python3 scripts/hypothesis_space_campaign.py
      - name: Hypothesis ranker shadow state
        run: python3 scripts/hypothesis_ranker.py
      - name: Knowledge graph (data/knowledge_graph.json + .md)
        run: |
          python3 scripts/test_build_knowledge_graph.py
          python3 scripts/build_knowledge_graph.py
      - name: Coverage report (COVERAGE.md)
        run: python3 scripts/coverage_report.py
      - name: Canonical snapshot (STATUS.md)
        run: python3 scripts/gen_status.py
      - name: ECDLP decision view (repo/ECDLP_DECISION_SUBSTRATE.md)
        run: python3 scripts/build_ecdlp_decision_view.py
      # Regenerated LAST: the manifest records byte sizes of the tier files above
      # (STATUS.md, COVERAGE.md, knowledge_graph.json, …), so its inputs must be fresh first.
      - name: Agent-bundle manifest (bundles/MANIFEST.json)
        run: python3 scripts/export_agent_bundle.py --manifest
      - name: Dashboard + public site
        run: python3 scripts/build_dashboard.py

      # ---- consistency gate: no retired headline counts, canonical figure present ----
      - name: Count-consistency gate
        run: python3 scripts/check_counts.py
      - name: Research OS consistency gate
        run: python3 scripts/check_status_consistency.py
      - name: Product model and public-claim gate
        run: python3 scripts/check_product_model.py
      - name: Product-model evidence lifecycle fixtures
        run: python3 scripts/test_check_product_model.py
      - name: Canonical task and verified-result rendering fixtures
        run: |
          python3 scripts/test_gen_verified_index.py
          python3 scripts/test_site_generator.py
          python3 scripts/test_public_site.py
          node --check assets/site.js
      - name: Formal-substrate architecture gate
        run: python3 scripts/check_formal_substrate.py
      - name: ECDLP decision-substrate gate
        run: python3 scripts/check_ecdlp_decision_substrate.py
      - name: Research Engine v0 gate
        run: python3 scripts/check_research_engine.py
      - name: Typed evidence and desk-decision gate
        run: |
          python3 scripts/build_typed_evidence_state.py --check
          python3 scripts/test_typed_evidence.py
      - name: PKC smooth-subgroup desk-screen gate
        run: |
          python3 experiments/engine/pkc_smooth_desk_screen/generate.py --check
          python3 experiments/engine/pkc_smooth_desk_screen/validate.py
      - name: PKC nonsplit-torus desk-screen gate
        run: |
          python3 experiments/engine/pkc_nonsplit_torus_desk_screen/generate.py --check
          python3 experiments/engine/pkc_nonsplit_torus_desk_screen/validate.py
          python3 experiments/engine/pkc_nonsplit_torus_desk_screen/test_validate.py
      - name: PKC sextic-twist CM arithmetic-certificate gate
        run: |
          python3 experiments/pkc_sextic_twist_cm_screen/generate.py --check
          python3 experiments/pkc_sextic_twist_cm_screen/validate.py
          python3 experiments/pkc_sextic_twist_cm_screen/test_validate.py
      - name: PKC M16 symbolic desk certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_symbolic_desk/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_symbolic_desk/validate.py

      - name: PKC M16 factor-base census and regime assurance
        run: |
          python3 experiments/engine/pkc_smooth_m16_regime_assurance_desk/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_regime_assurance_desk/validate.py
          python3 experiments/engine/pkc_smooth_m16_regime_assurance_desk/test_validate.py
          python3 -m py_compile experiments/engine/pkc_smooth_m16_regime_assurance_desk/*.py
          (cd experiments/engine/pkc_smooth_m16_regime_assurance_desk && sha256sum -c artifact.sha256)
      - name: PKC M16 source-faithful mechanism and sound acceptance
        run: |
          python3 experiments/engine/pkc_smooth_m16_source_faithful_mechanism/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_source_faithful_mechanism/validate.py
          python3 experiments/engine/pkc_smooth_m16_source_faithful_mechanism/test_validate.py
          python3 -m py_compile experiments/engine/pkc_smooth_m16_source_faithful_mechanism/*.py
          (cd experiments/engine/pkc_smooth_m16_source_faithful_mechanism && sha256sum -c artifact.sha256)
      - name: PKC M16 semantic bridge certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_semantic_bridge/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_semantic_bridge/validate.py
          (cd experiments/engine/pkc_smooth_m16_semantic_bridge && sha256sum -c artifact.sha256)
      - name: PKC M16 exceptional-fiber certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_exceptional_fibers/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_exceptional_fibers/validate.py
          python3 experiments/engine/pkc_smooth_m16_exceptional_fibers/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_exceptional_fibers && sha256sum -c artifact.sha256)
      - name: PKC M16 projective S17 bridge certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_projective_bridge/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_projective_bridge/validate.py
          python3 experiments/engine/pkc_smooth_m16_projective_bridge/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_projective_bridge && sha256sum -c artifact.sha256)
      - name: PKC M16 projective resultant kernel certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_projective_resultant_kernel/validate.py
          python3 experiments/engine/pkc_smooth_m16_projective_resultant_kernel/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_projective_resultant_kernel && sha256sum -c artifact.sha256)
      - name: PKC M16 frozen C_r specialization certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_frozen_cr_specialization/validate.py
          python3 experiments/engine/pkc_smooth_m16_frozen_cr_specialization/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_frozen_cr_specialization && sha256sum -c artifact.sha256)
      - name: PKC M16 frozen projective witness certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_frozen_projective_witness/validate.py
          python3 experiments/engine/pkc_smooth_m16_frozen_projective_witness/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_frozen_projective_witness && sha256sum -c artifact.sha256)
      - name: PKC M16 guarded projective-system certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_guarded_projective_system/validate.py
          python3 experiments/engine/pkc_smooth_m16_guarded_projective_system/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_guarded_projective_system && sha256sum -c artifact.sha256)
      - name: PKC M16 exact chart-cover certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_exact_chart_cover/validate.py --require-final-source-binding
          python3 experiments/engine/pkc_smooth_m16_exact_chart_cover/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_exact_chart_cover && sha256sum -c artifact.sha256)
      - name: PKC M16 infinity-stratum certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_infinity_strata/validate.py --require-final-source-binding
          python3 experiments/engine/pkc_smooth_m16_infinity_strata/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_infinity_strata && sha256sum -c artifact.sha256)
      - name: PKC M16 infinity-propagation certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_infinity_propagation/validate.py --require-final-source-binding
          python3 experiments/engine/pkc_smooth_m16_infinity_propagation/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_infinity_propagation && sha256sum -c artifact.sha256)
      - name: Replay completed M16 fixed-target experiment
        run: |
          python3 experiments/engine/pkc_smooth_m16_fixed_target_yield/replay_completed.py
          python3 experiments/engine/pkc_smooth_m16_fixed_target_yield/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_fixed_target_yield && sha256sum -c artifact.sha256)
      - name: Claim-level truth-state gate
        run: |
          python3 scripts/research_claims.py --check
          python3 scripts/test_research_claims.py
      - name: Cross-registry scientific-semantic gate
        run: |
          python3 scripts/check_scientific_semantics.py
          python3 scripts/test_scientific_semantics.py
      - name: Research Engine v0 regression fixtures
        run: python3 scripts/test_research_engine.py
      - name: Research Engine v0.2 lifecycle and acceptance
        run: |
          python3 scripts/build_research_engine_v02_state.py --check
          python3 scripts/test_research_engine_v02.py
          python3 scripts/check_research_engine_v02_acceptance.py
      - name: Research Engine shadow-intake gate
        run: |
          python3 scripts/build_research_shadow_intake.py --check
          python3 scripts/test_research_shadow_intake.py
      - name: Quarantined untrusted-intake gate
        run: |
          python3 scripts/build_untrusted_evidence_intake.py --check
          python3 scripts/test_untrusted_evidence_intake.py
      - name: Research-question funnel gate
        run: |
          python3 scripts/hypothesis_funnel.py --check
          python3 scripts/test_hypothesis_funnel.py
      - name: Million-cell research-question space gate
        run: |
          python3 scripts/hypothesis_space_funnel.py --check
          python3 scripts/test_hypothesis_space_funnel.py
      - name: Immutable hypothesis-space run-memory gate
        run: |
          python3 scripts/hypothesis_space_run_ledger.py --check
          python3 scripts/test_hypothesis_space_run_ledger.py
      - name: Finite unique-coverage campaign gate
        run: |
          python3 scripts/hypothesis_space_campaign.py --check --replay
          python3 scripts/test_hypothesis_space_campaign.py
      - name: Hypothesis ranker shadow gate
        run: |
          python3 scripts/sync_hypothesis_review_ledger.py --check
          python3 scripts/hypothesis_ranker.py --check
          python3 scripts/test_hypothesis_ranker.py
          python3 scripts/train_hypothesis_ranker.py --check-ready
          python3 scripts/test_train_hypothesis_ranker.py
      - name: Model-assisted proposal drafter shadow gate
        run: |
          python3 scripts/hypothesis_model_drafter.py --limit 10 > /dev/null
          python3 scripts/test_hypothesis_model_drafter.py
      - name: GLV diagonal-action obstruction certificate
        run: |
          python3 experiments/glv_diagonal_obstruction/generate.py --check
          python3 experiments/glv_diagonal_obstruction/validate.py
      - name: GLV-Semaev coordinate-scaling certificate
        run: |
          python3 -m pip install -r experiments/glv_semaev_symmetry/requirements.txt
          python3 experiments/glv_semaev_symmetry/generate.py --check
          python3 experiments/glv_semaev_symmetry/generate_fixed_target.py --check
          python3 experiments/glv_semaev_symmetry/validate_fixed_target.py
          python3 experiments/glv_semaev_symmetry/validate.py
      - name: Candidate-evaluation framework tests
        run: python3 experiments/framework/test_framework.py
      - name: Repository artifact manifest gate
        run: python3 scripts/check_repo_artifacts.py
      - name: Result-registry and cross-lane navigation gates
        run: |
          python3 scripts/gen_result_registry.py --check
          python3 scripts/gen_researchos_registry.py --check
          python3 scripts/gen_verified_index.py --check
      - name: Full-ledger axiom-audit generation gate
        run: python3 scripts/gen_axiom_audit.py --check
      - name: Generated-artifact fixpoint gate
        run: python3 scripts/check_generated_fixpoint.py --check
      - name: Source-registry gate (cited works ↔ docs provenance in sync)
        run: python3 scripts/gen_source_registry.py --check

      # ---- did regeneration change any generated artifact? ----
      - name: Detect derived-artifact drift
        id: drift
        run: |
          if git diff --quiet -- $DERIVED_PURE; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
            echo "generated artifacts already in sync with sources"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
            echo "::group::derived-artifact drift"
            git --no-pager diff --stat -- $DERIVED_PURE
            echo "::endgroup::"
          fi

      # ---- on a PR: fail so drift is fixed in review (never auto-commit onto someone's PR) ----
      - name: Fail on drift (pull request)
        if: github.event_name == 'pull_request' && steps.drift.outputs.dirty == 'true'
        run: |
          echo "::error::Derived artifacts are stale. Run ALL the generators locally (in this order) and commit the result:"
          echo "  python3 scripts/gen_stats.py && python3 scripts/build_frontier_map.py"
          echo "  python3 scripts/gen_result_registry.py && python3 scripts/gen_researchos_registry.py"
          echo "  python3 scripts/gen_verified_index.py && python3 scripts/gen_axiom_audit.py"
          echo "  python3 scripts/gen_source_registry.py"
          echo "  python3 scripts/build_typed_evidence_state.py && python3 scripts/research_claims.py"
          echo "  python3 scripts/build_research_engine_state.py"
          echo "  python3 scripts/build_research_engine_v02_state.py"
          echo "  python3 scripts/build_research_shadow_intake.py"
          echo "  python3 scripts/build_untrusted_evidence_intake.py"
          echo "  python3 scripts/hypothesis_funnel.py"
          echo "  python3 scripts/hypothesis_space_funnel.py"
          echo "  python3 scripts/hypothesis_space_run_ledger.py"
          echo "  python3 scripts/hypothesis_space_campaign.py"
          echo "  python3 scripts/hypothesis_ranker.py"
          echo "  python3 scripts/build_knowledge_graph.py && python3 scripts/coverage_report.py"
          echo "  python3 scripts/gen_status.py"
          echo "  python3 scripts/build_ecdlp_decision_view.py"
          echo "  python3 scripts/export_agent_bundle.py --manifest"
          echo "  python3 scripts/build_dashboard.py"
          git --no-pager diff -- $DERIVED_PURE
          exit 1

      # ---- on main / manual run: auto-commit the refreshed artifacts ----
      - name: Commit refreshed artifacts
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- $DERIVED_PURE; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DERIVED_PURE
          git commit -m "chore(docs): resync derived artifacts from sources [skip ci]"
          git push
