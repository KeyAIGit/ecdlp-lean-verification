name: v0.2 release assurance

# Branch-scoped assurance only; no deployments, external services, or secrets.
on:
  push:
    branches: ['release/v0.2-assurance']
    paths:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v02-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the exact revision without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Archive tracked review sources and record provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-v02"
          git bundle create "$RUNNER_TEMP/release-v02/history.bundle" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/release-v02/SOURCE_COMMIT"
          git ls-files -z | grep -zv '^fonts/' | tar --null -T - -czf "$RUNNER_TEMP/release-v02/source.tar.gz"
          (cd "$RUNNER_TEMP/release-v02" && sha256sum source.tar.gz > SHA256SUMS)
      - name: Preserve commit-bound review sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-v02-source-${{ github.sha }}
          path: ${{ runner.temp }}/release-v02/
          retention-days: 7
          if-no-files-found: error

  parity-kernel-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install the pinned toolchain through a pinned bootstrap source
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/leanprover/elan/58e8d545e33641f66dbcbd22c4283109e71757be/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib and check the new statements directly
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get
          lake env lean Ecdlp/Proved/CanonicalScalarParity.lean
