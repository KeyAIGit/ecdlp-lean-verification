name: One-time M16 archival transfer
on:
  push:
    branches: ['research/m16-evidence-intake-20260910']
    paths: ['archive/m16-transfer-20260910/**', '.github/workflows/m16-archive-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m16-archival-transfer
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'KeyAIGit/ecdlp-lean-verification' && github.ref == 'refs/heads/research/m16-evidence-intake-20260910'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout exact transport source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Prepare bounded archival dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/m16-env"
          "$RUNNER_TEMP/m16-env/bin/python" -m pip install sympy==1.14.0
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgmp-dev gcc
      - name: Restore and require original archive hashes
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/m16-env/bin/python" archive/m16-transfer-20260910/restore.py archive/m16-transfer-20260910/transport "$RUNNER_TEMP/m16-restore" | tee "$RUNNER_TEMP/m16-restore.log"
          "$RUNNER_TEMP/m16-env/bin/python" archive/m16-transfer-20260910/install.py "$RUNNER_TEMP/m16-restore/publish"
      - name: Check public archival bytes and regressions
        run: |
          set -euo pipefail
          python3 release_candidates/m16-20260910/audit_archives.py
          python3 -m unittest discover -s release_candidates/m16-20260910 -p 'test_*.py' -v
          (cd release_candidates/m16-20260910 && sha256sum -c MANIFEST.sha256)
          python3 scripts/gen_source_registry.py
          python3 scripts/gen_source_registry.py --check
          git diff --check
      - name: Publish only to unchanged feature branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=research/m16-evidence-intake-20260910
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_HEAD"
          git add -- release_candidates/m16-20260910 archive/m16-20260910 data/source_registry.json
          python3 - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          for p in filter(None,paths):
              if not (p.startswith('release_candidates/m16-20260910/') or p.startswith('archive/m16-20260910/') or p=='data/source_registry.json'):
                  raise SystemExit('Unapproved publication path: '+p)
          PY
          git -c user.name='KeyAI archival publication' -c user.email='202038418+KeyAIGit@users.noreply.github.com' commit -m 'Publish exact M16 research archives and complete expanded sources' -m 'Four original SHA-256 archives and 98 original snapshot files. Retain historical reports, hashes, scripts and field-element arrays. No new science, Lean promotion, grant submission or unknown-target solution claimed. Full repository CI remains a separate gate.'
          git push origin "HEAD:refs/heads/$branch"
      - name: Retain restoration diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m16-archive-restoration-${{ github.run_id }}
          path: ${{ runner.temp }}/m16-restore.log
          if-no-files-found: warn
          retention-days: 7
