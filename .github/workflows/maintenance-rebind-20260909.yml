name: Source-bound maintenance rebind
on:
  push:
    branches: [review/oss-readiness-20260909]
    paths: [.github/workflows/maintenance-rebind-20260909.yml]
permissions:
  contents: read
jobs:
  rebind:
    if: github.repository == 'KeyAIGit/ecdlp-lean-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Regenerate exact reviewed inputs without changing scientific decisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 3092c8ba73e4bb1c40edc88c9bb9a1627e9a811c
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from check_generated_fixpoint import GENERATORS
          expected = {
            'data/hypothesis_funnel_state.json': ('08c80efa132b33a3fe05da15f407dd7625ccdd28ceded9563cd5c13d820162aa','4eeacc21611119f58cbb3e721cd350ab176ef9822559c7df06c226bdaf8ba3c0'),
            'data/hypothesis_ranker_state.json': ('c5c5b95474c50f7a8160518e5fbb4c17282e262ecd56fde7b7abeb22ee1d9eae','bdbad45f71effb29370aed7ff1ec1d1582aadad210989e014c93a89321c11ab4'),
            'data/hypothesis_space_campaign_state.json': ('39d7ee8eac2ecacc7b69986055fc0c461097b43a68ddd6a2b3733336cc49f044','f834b898b712a5b930937520ec578d14b472f50ad290182c3bc01aa006a75325'),
            'data/hypothesis_space_map.json': ('c147bef6de4d005d07e1c1584ff65ec042f6f1d82b001309025b96d1f871567a','ad705436f23d9ae0e9a05129ea464ef663579024e053b97673452c72e7c68123'),
            'data/hypothesis_space_state.json': ('298bff3d979b8ea52c5d563b00ecbfafee856be0490090920b953c82916ba38a','3d5a91a5ab7a51136d9cade23ba900a7154d3e4b1ccea3cce9fe64ae16c854bd'),
            'data/knowledge_graph.json': ('c237ca1177b2571c6526c18d5c9a9c08e18f7d39eb6a6ed3de51d9783f56c771','d99f4be221574e0239a277d3c0751ed70b725c882eed40c785693b663484e4f9'),
            'data/research_engine_state.json': ('7d08b757f57d86a6bea978ca87276b6ba40e73dc938e2f39db8b8d3c5f9c37b7','8147e66b3541d2a177e45bba084a8b4449d36129694e7b90b287081425553056'),
            'data/typed_evidence_state.json': ('7395313aadb2c1d0a49456a0601a6648a7d9ba1ac7f686f25d95d68c400edb7b','ebeb447cdb3715160a075f7fa35fd33586f3ab7c4544e108cdbdefa4a1f2176b'),
            'repo/HYPOTHESIS_SPACE_V2.json': ('787442349e24d05d4baf4b0c73b8cfa485f624685dd262648e4839845c0a685a','83498cb73850a5e4e7a92bfe6958f1e6d35978dce1488742c9e7f422b37e1801'),
          }
          def require(ok, msg):
            if not ok: raise RuntimeError(msg)
          def sha(path): return hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
          for path, (old, _) in expected.items(): require(sha(path)==old, 'Unexpected input: '+path)
          original = {p: json.loads(pathlib.Path(p).read_text()) for p in expected}
          runner = "import runpy,sys;p=sys.argv[1];sys.argv=sys.argv[1:];sys.path.insert(0,'scripts');runpy.run_path(p,run_name='__main__')"
          def run(args): subprocess.run([sys.executable,'-c',runner,*args], check=True)
          for args in GENERATORS[:15]: run(args)
          policy = pathlib.Path('repo/HYPOTHESIS_SPACE_V2.json')
          old = original[str(policy)]['parent_funnel']['expected_merkle_root_sha256']
          new = json.loads(pathlib.Path('data/hypothesis_funnel_state.json').read_text())['bulk_contract']['merkle_root_sha256']
          require(new=='f3a8307285b1efd765d03021998c4a0cc338b0c995bde1cfb71b915676de903e', 'Unexpected parent root')
          text = policy.read_text(); require(text.count(old)==1, 'Ambiguous parent binding')
          policy.write_text(text.replace(old,new))
          for args in GENERATORS[15:]: run(args)
          changed = set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          require(changed==set(expected), 'Unexpected changed paths: '+str(changed ^ set(expected)))
          for path, (_, new_sha) in expected.items():
            require(sha(path)==new_sha, 'Output differs from local replay: '+path)
            current=json.loads(pathlib.Path(path).read_text())
            require(current.get('counts')==original[path].get('counts'), 'Scientific counts changed: '+path)
          for field in ('cells','source_claims','target_properties','barriers','cost_quantities','desk_decisions','trust_boundary','authorization_boundary'):
            require(original['data/typed_evidence_state.json'][field]==json.loads(pathlib.Path('data/typed_evidence_state.json').read_text())[field], 'Evidence semantics changed: '+field)
          for args in GENERATORS: run(args)
          for path, (_, new_sha) in expected.items(): require(sha(path)==new_sha, 'Second pass changed '+path)
          require(set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())==set(expected),'Second pass changed extra paths')
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*sorted(expected)],check=True)
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'maintenance-rebind';out.mkdir()
          (out/'expected.json').write_text(json.dumps(expected,indent=2)+'\n')
          (out/'rebind.patch').write_bytes(subprocess.check_output(['git','diff','--cached','--binary']))
          (out/'summary.txt').write_text('Exact nine-file source rebind reproduced twice. Scientific counts, typed decisions, historical runs and outcomes preserved. Seed IDs and deterministic diagnostic samples refresh for the changed evidence identity; no new scientific experiment or accepted proof is counted. Full canonical CI remains required.\n')
          PY
      - name: Replay regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_typed_evidence_state.py --check
          python3 scripts/test_typed_evidence.py
          python3 scripts/test_check_axioms.py
          python3 scripts/test_v02_assurance.py
          python3 scripts/check_scientific_semantics.py
          python3 scripts/check_research_engine.py
          python3 scripts/check_research_engine_v02_acceptance.py
          python3 scripts/hypothesis_space_run_ledger.py --check
          python3 scripts/hypothesis_space_campaign.py --check --replay
          python3 scripts/hypothesis_ranker.py --check
      - name: Publish only the verified generated rebind to this review branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore(provenance): rebind generated evidence after kernel-only GLV repair' -m 'Nine exact pre/post-hashed files, regenerated twice. Preserve scientific counts, decisions, historical run/outcome records, trust rules, and proof statements. Diagnostic samples and instance IDs refresh because the actual evidence source changed. Full canonical CI is still required.'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/review/oss-readiness-20260909
          git rev-parse HEAD > "$RUNNER_TEMP/maintenance-rebind/published-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: maintenance-rebind-${{ github.run_id }}
          path: ${{ runner.temp }}/maintenance-rebind/
          retention-days: 7
          if-no-files-found: warn
