name: Licensing source snapshot
on:
  push:
    branches: [review/oss-readiness-20260909]
    paths: [.github/workflows/licensing-source-snapshot.yml]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.repository == 'KeyAIGit/ecdlp-lean-verification'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive source and credential-free Git objects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/licensing-review"
          git archive --format=tar.gz -o "$RUNNER_TEMP/licensing-review/source.tar.gz" HEAD
          git bundle create "$RUNNER_TEMP/licensing-review/history.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/licensing-review/source-commit.txt"
          git ls-tree -r HEAD > "$RUNNER_TEMP/licensing-review/tree.txt"
          df -h > "$RUNNER_TEMP/licensing-review/runner-disk.txt"
          sha256sum "$RUNNER_TEMP/licensing-review/source.tar.gz" "$RUNNER_TEMP/licensing-review/history.bundle" > "$RUNNER_TEMP/licensing-review/checksums.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: licensing-review-${{ github.sha }}
          path: ${{ runner.temp }}/licensing-review/
          retention-days: 3
          if-no-files-found: error
