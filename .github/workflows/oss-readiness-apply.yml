name: Apply reviewed OSS readiness patch once

on:
  push:
    branches: [review/oss-readiness-20260909]
    paths: [.github/workflows/oss-readiness-apply.yml]

permissions:
  contents: read

concurrency:
  group: oss-readiness-apply-20260909
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: github.repository == 'KeyAIGit/ecdlp-lean-verification' && github.actor == 'KeyAIGit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout exact reviewed branch without storing credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify patch, apply only reviewed paths, and remove transport
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, os, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          base = 'be986579ed7b624220d48763d06379517ba871f9'
          branch = 'refs/heads/review/oss-readiness-20260909'
          assert os.environ['GITHUB_REF'] == branch
          assert git('rev-parse', 'HEAD') == os.environ['GITHUB_SHA']
          parts = [f'.github/oss-readiness-patch.{i}.b64' for i in (1, 2, 3)]
          transport = parts + ['.github/workflows/oss-readiness-apply.yml']
          # Nothing else may have changed since the audited pre-transport base.
          assert set(git('diff', '--name-only', base, 'HEAD').splitlines()) == set(transport)
          encoded = ''.join(Path(p).read_text().strip() for p in parts)
          assert len(encoded) == 25176, 'transport length mismatch'
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'cc54f22bdee42148dea508d422a71b55354ba1ed368f22d2343a5e13a270d32a', 'transport digest mismatch'
          patch = lzma.decompress(compressed, memlimit=256 * 1024 * 1024)
          assert len(patch) == 64961
          assert hashlib.sha256(patch).hexdigest() == '33030394818ed6cbf54c813146221bf56f92c633ecc8930c71de70f00687be5a', 'patch digest mismatch'
          reviewed = {
              '.github/workflows/ci.yml', '.github/workflows/oss-readiness-snapshot.yml',
              'CONTRIBUTING.md', 'LICENSES/Apache-2.0.txt', 'LICENSING.md', 'README.md',
              'SECURITY.md', 'THIRD_PARTY_NOTICES.md', 'bundles/MANIFEST.json',
              'docs/OSS_READINESS_REVIEW_20260909.md', 'fonts/OFL-Baloo2.txt',
              'fonts/OFL-Nunito.txt', 'repo/ARTIFACTS.yaml', 'repo/OSS_READINESS.json',
              'requirements.txt', 'scripts/check_oss_readiness.py', 'scripts/test_check_oss_readiness.py'
          }
          subprocess.run(['git', 'apply', '--index', '--binary', '--whitespace=error', '-'], input=patch, check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == reviewed
          subprocess.run(['git', 'rm', '--', *transport], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == reviewed | set(transport)
          # This tree hash covers the WHOLE final repository, not just the patch.
          assert git('write-tree') == '58680eef5ca95eddebac0db2262a82aa4d30826d', 'final source differs from locally tested tree'
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          print('Exact reviewed tree verified. No canonical proof or archive source was changed.')
          PY
      - name: Replay cheap acceptance checks before branch-only publication
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_oss_readiness.py
          python3 scripts/test_check_oss_readiness.py
          python3 scripts/export_agent_bundle.py --check
          python3 scripts/check_repo_artifacts.py
          python3 scripts/check_automation_inventory.py
          python3 scripts/check_counts.py
          python3 scripts/check_semantic_drift.py
          python3 scripts/gen_axiom_audit.py --check
          python3 scripts/check_ledger_isolation.py
          if python3 scripts/check_oss_readiness.py --require-release-ready; then
            echo 'Unexpected rights clearance; aborting publication.' >&2
            exit 1
          fi
          git diff --exit-code
          test "$(git write-tree)" = '58680eef5ca95eddebac0db2262a82aa4d30826d'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(oss): preserve third-party notices, document pending rights, and repair v0.2 metadata drift'
      - name: Publish only the review branch without force
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'KeyAIGit/ecdlp-lean-verification'
          test "$GITHUB_REF" = 'refs/heads/review/oss-readiness-20260909'
          test "$(git rev-parse HEAD^{tree})" = '58680eef5ca95eddebac0db2262a82aa4d30826d'
          # Credential exists only for this push step, never in repository config.
          # Non-fast-forward pushes fail if another writer changed the branch.
          git -c credential.helper= -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push \
            "https://github.com/$GITHUB_REPOSITORY.git" \
            'HEAD:refs/heads/review/oss-readiness-20260909'
          echo 'Review branch published. Main and other branches are unchanged.'
