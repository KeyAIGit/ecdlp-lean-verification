name: Verify Lean proofs

# Triggers: every push, every pull request, and manual run.
# (The hourly `schedule` cron was removed — it rebuilt all of Mathlib every hour and
# burned Actions minutes for no benefit. Verification runs on push / PR / dispatch.)
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-memory:
    name: Discovery memory synthetic checks (not Lean)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify source manifest and run isolated temporary-data tests
        run: |
          set -euo pipefail
          (cd release_candidates/discovery-memory-v2-20260911 && sha256sum -c MANIFEST.sha256)
          python3 -m unittest discover -s release_candidates/discovery-memory-v2-20260911 -p 'test_memory*.py' -v
  m16-intake:
    name: M16 candidate evidence (not Lean)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout evidence source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Replay unpromoted polynomial evidence and adverse-input tests
        run: |
          set -euo pipefail
          (cd release_candidates/m16-20260910 && sha256sum -c MANIFEST.sha256)
          python3 release_candidates/m16-20260910/replay.py > "$RUNNER_TEMP/m16-replay.json"
          cmp "$RUNNER_TEMP/m16-replay.json" release_candidates/m16-20260910/replay_result.json
          python3 -m unittest discover -s release_candidates/m16-20260910 -p 'test_*.py' -v

  v02-candidates:
    name: Isolated v0.2 candidates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Additional consistency and failure-path fixtures
        run: python3 scripts/test_v02_assurance.py
      - name: Replay Python controls and axiom-gate fixtures
        run: python3 scripts/verify_v02.py --python-only
      - name: Install pinned elan bootstrap source
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # This reviewed candidate imports only Init. Use the pinned Lean toolchain
      # directly so unrelated Mathlib builds cannot hide its acceptance result.
      - name: Compile all six isolated candidates and audit exact axioms
        run: |
          set -euo pipefail
          lean --version
          lean release_candidates/v0.2/InformationLoss.lean > candidate_axioms.log 2>&1 \
            || { cat candidate_axioms.log; exit 1; }
          cat candidate_axioms.log
          python3 scripts/check_axioms.py candidate_axioms.log release_candidates/v0.2/axiom_registry.json

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-09-05
        with:
          # Research Engine outcomes bind evidence to prior source commits.
          # A shallow checkout makes valid provenance look nonexistent.
          fetch-depth: 0
          persist-credentials: false

      - name: Check license and notice metadata (not legal clearance)
        run: |
          python3 scripts/check_oss_readiness.py
          python3 scripts/test_check_oss_readiness.py

      - name: Test hosted-runner disk preparation guards
        run: python3 scripts/test_prepare_lean_ci.py

      - name: Reserve disk for Lean and Mathlib on the disposable runner
        run: python3 scripts/prepare_lean_ci.py --apply

      - name: Check agent-bundle manifest
        run: python3 scripts/export_agent_bundle.py --check

      # Cheap doc gate: fail on count drift (the headline count regressed 3x).
      - name: Check count consistency (docs)
        run: python3 scripts/check_counts.py

      # Regression fixtures for the count-gate hardening (table-identity guard, bidirectional
      # off-canonical scan, canonical-line uniqueness). Fast, pure-Python, no toolchain.
      - name: Count-gate fixtures
        run: python3 scripts/test_check_counts.py

      # Semantic-drift gate: fail if a retired unconditional overclaim (full Shoup, proved
      # Θ(√n), universal GLV no-go, Semaev prime-field no-advantage, unconditional trace)
      # reappears in the docs / Lean docstrings / publication surfaces.
      - name: Check semantic drift (overclaims)
        run: python3 scripts/check_semantic_drift.py

      # Research OS gate: fail when generated machine views, canonical status,
      # public counters, active tasks, or hypotheses drift apart.
      - name: Check Research OS consistency
        run: |
          python3 scripts/check_status_consistency.py
          python3 scripts/test_build_knowledge_graph.py

      - name: Check product model and public-claim boundary
        run: python3 scripts/check_product_model.py

      - name: Test product-model evidence lifecycle
        run: python3 scripts/test_check_product_model.py

      - name: Test canonical task and public-site rendering
        run: |
          python3 scripts/test_site_generator.py
          python3 scripts/test_public_site.py
          node --check assets/site.js

      - name: Check formal-substrate architecture
        run: python3 scripts/check_formal_substrate.py

      - name: Check ECDLP decision substrate
        run: python3 scripts/check_ecdlp_decision_substrate.py

      - name: Check typed evidence and desk decisions
        run: |
          python3 scripts/build_typed_evidence_state.py --check
          python3 scripts/test_typed_evidence.py

      - name: Replay PKC smooth-subgroup desk screen
        run: |
          python3 experiments/engine/pkc_smooth_desk_screen/generate.py --check
          python3 experiments/engine/pkc_smooth_desk_screen/validate.py

      - name: Replay PKC nonsplit-torus desk screen
        run: |
          python3 experiments/engine/pkc_nonsplit_torus_desk_screen/generate.py --check
          python3 experiments/engine/pkc_nonsplit_torus_desk_screen/validate.py
          python3 experiments/engine/pkc_nonsplit_torus_desk_screen/test_validate.py

      - name: Replay PKC sextic-twist CM arithmetic certificate
        run: |
          python3 experiments/pkc_sextic_twist_cm_screen/generate.py --check
          python3 experiments/pkc_sextic_twist_cm_screen/validate.py
          python3 experiments/pkc_sextic_twist_cm_screen/test_validate.py

      - name: Replay PKC M16 symbolic desk certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_symbolic_desk/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_symbolic_desk/validate.py

      - name: Replay PKC M16 factor-base census and regime assurance
        run: |
          python3 experiments/engine/pkc_smooth_m16_regime_assurance_desk/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_regime_assurance_desk/validate.py
          python3 experiments/engine/pkc_smooth_m16_regime_assurance_desk/test_validate.py
          python3 -m py_compile experiments/engine/pkc_smooth_m16_regime_assurance_desk/*.py
          (cd experiments/engine/pkc_smooth_m16_regime_assurance_desk && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 source-faithful mechanism and sound acceptance
        run: |
          python3 experiments/engine/pkc_smooth_m16_source_faithful_mechanism/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_source_faithful_mechanism/validate.py
          python3 experiments/engine/pkc_smooth_m16_source_faithful_mechanism/test_validate.py
          python3 -m py_compile experiments/engine/pkc_smooth_m16_source_faithful_mechanism/*.py
          (cd experiments/engine/pkc_smooth_m16_source_faithful_mechanism && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 semantic bridge certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_semantic_bridge/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_semantic_bridge/validate.py
          (cd experiments/engine/pkc_smooth_m16_semantic_bridge && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 exceptional-fiber certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_exceptional_fibers/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_exceptional_fibers/validate.py
          python3 experiments/engine/pkc_smooth_m16_exceptional_fibers/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_exceptional_fibers && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 projective S17 bridge certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_projective_bridge/generate.py --check
          python3 experiments/engine/pkc_smooth_m16_projective_bridge/validate.py
          python3 experiments/engine/pkc_smooth_m16_projective_bridge/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_projective_bridge && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 projective resultant kernel certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_projective_resultant_kernel/validate.py
          python3 experiments/engine/pkc_smooth_m16_projective_resultant_kernel/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_projective_resultant_kernel && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 frozen C_r specialization certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_frozen_cr_specialization/validate.py
          python3 experiments/engine/pkc_smooth_m16_frozen_cr_specialization/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_frozen_cr_specialization && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 frozen projective witness certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_frozen_projective_witness/validate.py
          python3 experiments/engine/pkc_smooth_m16_frozen_projective_witness/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_frozen_projective_witness && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 guarded projective-system certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_guarded_projective_system/validate.py
          python3 experiments/engine/pkc_smooth_m16_guarded_projective_system/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_guarded_projective_system && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 exact chart-cover certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_exact_chart_cover/validate.py --require-final-source-binding
          python3 experiments/engine/pkc_smooth_m16_exact_chart_cover/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_exact_chart_cover && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 infinity-stratum certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_infinity_strata/validate.py --require-final-source-binding
          python3 experiments/engine/pkc_smooth_m16_infinity_strata/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_infinity_strata && sha256sum -c artifact.sha256)

      - name: Replay PKC M16 infinity-propagation certificate
        run: |
          python3 experiments/engine/pkc_smooth_m16_infinity_propagation/validate.py --require-final-source-binding
          python3 experiments/engine/pkc_smooth_m16_infinity_propagation/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_infinity_propagation && sha256sum -c artifact.sha256)

      - name: Replay M16 solver-slope regime barrier
        run: python3 scripts/certs/m16_solver_slope_regime_check.py

      - name: Replay completed M16 fixed-target experiment
        run: |
          python3 experiments/engine/pkc_smooth_m16_fixed_target_yield/replay_completed.py
          python3 experiments/engine/pkc_smooth_m16_fixed_target_yield/test_validate.py
          (cd experiments/engine/pkc_smooth_m16_fixed_target_yield && sha256sum -c artifact.sha256)

      - name: Check generated Research Engine state
        run: python3 scripts/build_research_engine_state.py --check

      - name: Check Research Engine v0
        run: python3 scripts/check_research_engine.py

      - name: Test Research Engine v0
        run: python3 scripts/test_research_engine.py

      - name: Check Research Engine v0.2 lifecycle and acceptance
        run: |
          python3 scripts/build_research_engine_v02_state.py --check
          python3 scripts/test_research_engine_v02.py
          python3 scripts/check_research_engine_v02_acceptance.py

      - name: Check non-executable shadow intake
        run: |
          python3 scripts/build_research_shadow_intake.py --check
          python3 scripts/test_research_shadow_intake.py

      - name: Check quarantined untrusted evidence intake
        run: |
          python3 scripts/build_untrusted_evidence_intake.py --check
          python3 scripts/test_untrusted_evidence_intake.py
          python3 -m py_compile scripts/build_untrusted_evidence_intake.py scripts/test_untrusted_evidence_intake.py

      - name: Replay 100k research-question funnel
        run: |
          python3 scripts/hypothesis_funnel.py --check
          python3 scripts/test_hypothesis_funnel.py

      - name: Replay million-cell research-question space
        run: |
          python3 scripts/hypothesis_space_funnel.py --check
          python3 scripts/test_hypothesis_space_funnel.py

      - name: Check immutable hypothesis-space run memory
        run: |
          python3 scripts/hypothesis_space_run_ledger.py --check
          python3 scripts/test_hypothesis_space_run_ledger.py

      - name: Check finite unique-coverage campaign memory
        run: |
          python3 scripts/hypothesis_space_campaign.py --check --replay
          python3 scripts/test_hypothesis_space_campaign.py

      - name: Check hypothesis review ledger and shadow ranker
        run: |
          python3 scripts/sync_hypothesis_review_ledger.py --check
          python3 scripts/hypothesis_ranker.py --check
          python3 scripts/test_hypothesis_ranker.py

      - name: Check model-assisted proposal drafter boundary
        run: |
          python3 scripts/hypothesis_model_drafter.py --limit 10 > /dev/null
          python3 scripts/test_hypothesis_model_drafter.py

      - name: Replay GLV diagonal-action obstruction certificate
        run: |
          python3 experiments/glv_diagonal_obstruction/generate.py --check
          python3 experiments/glv_diagonal_obstruction/validate.py

      - name: Replay GLV-Semaev coordinate-scaling certificate
        run: |
          python3 -m pip install -r experiments/glv_semaev_symmetry/requirements.txt
          python3 experiments/glv_semaev_symmetry/generate.py --check
          python3 experiments/glv_semaev_symmetry/validate.py
          python3 experiments/glv_semaev_symmetry/generate_fixed_target.py --check
          python3 experiments/glv_semaev_symmetry/validate_fixed_target.py

      - name: Check generated ECDLP decision view
        run: python3 scripts/build_ecdlp_decision_view.py --check

      - name: Test candidate-evaluation framework
        run: python3 experiments/framework/test_framework.py

      # Repo architecture gate: keep the manifest/review packet honest before
      # any cleanup PR can rely on them.
      - name: Check repository artifact manifest
        run: python3 scripts/check_repo_artifacts.py

      - name: Check workflow automation inventory
        run: python3 scripts/check_automation_inventory.py

      - name: Check remote branch inventory snapshot
        run: python3 scripts/check_branch_inventory.py

      - name: Test canonical ledger parser
        run: python3 scripts/test_ledger_utils.py

      - name: Test axiom-output parser
        run: python3 scripts/test_check_axioms.py

      # Provenance gate: every theorem name cited in VERIFIED.md must resolve to an actual
      # declaration in the built Lean source (Ecdlp/ minus Targets/) — catches ledger drift
      # from a renamed/removed theorem, deriving the registry from source not a hand number.
      - name: Check result registry (VERIFIED.md ↔ Lean source)
        run: python3 scripts/gen_result_registry.py --check

      # ResearchOS trust lane (S0-TRUST): every VERIFIED_RESEARCHOS.md row must
      # resolve to a built public ResearchOS declaration with a fresh statement
      # anchor, and — inversely — every built public ResearchOS declaration
      # must have a ledger row ("built ⇒ ledgered ⇒ audited").
      - name: Check ResearchOS result registry (VERIFIED_RESEARCHOS.md ↔ ResearchOS source)
        run: python3 scripts/gen_researchos_registry.py --check

      - name: Check generated full-ledger axiom audits (Ecdlp + ResearchOS)
        run: python3 scripts/gen_axiom_audit.py --check

      # Lane isolation (S0-TRUST): ResearchOS/RH results can never feed the
      # ECDLP headline surfaces; audit files are whitelisted by exact path;
      # every ResearchOS module is in the built import closure; no `axiom`
      # declaration exists in built source.
      - name: Check ECDLP/ResearchOS ledger isolation
        run: |
          python3 scripts/check_ledger_isolation.py
          python3 scripts/test_check_ledger_isolation.py

      # Provenance gate (literature side): every external work the docs cite (Shoup, Nechaev,
      # Semaev, Gaudry, Diem, FGHR, Petit, Pollard, Pohlig–Hellman, Schoof, Frey–Rück, MOV,
      # Smart, SEC 2, GLV, Shor, Luo) must have a registry entry, and its recorded where_used
      # must match the current
      # docs — catches a citation added/moved without updating the bibliography provenance.
      - name: Check source registry (docs ↔ bibliography provenance)
        run: python3 scripts/gen_source_registry.py --check

      - name: Check claim-level Research Engine truth state
        run: |
          python3 scripts/research_claims.py --check
          python3 scripts/test_research_claims.py

      - name: Check cross-registry scientific semantics
        run: |
          python3 scripts/check_scientific_semantics.py
          python3 scripts/test_scientific_semantics.py

      # Agent-bundle gate: the committed context-tier routing table
      # (bundles/MANIFEST.json) must reference only files that exist and stay in
      # sync with the tier definitions in scripts/export_agent_bundle.py.

      - name: Check generated-artifact fixpoint
        run: python3 scripts/check_generated_fixpoint.py --check

      # Domain-registry honesty gate (Phase-1 platform layer): a 'live' domain must
      # have its slot files present; 'planned'/'exploratory' placeholders must claim
      # no metrics. Keeps the multi-domain site surface provably honest.
      - name: Check domain registry
        run: python3 scripts/check_domains.py

      # Pre-pilot technical rehearsal gate. CI validates the committed contract,
      # evidence digests, and generic adapter fixtures without cloning or modifying
      # the pinned external repository. Re-running the external baseline remains an
      # explicit, networked rehearsal command.
      - name: Check portability rehearsal contract and evidence
        run: python3 scripts/check_portability_rehearsal.py --require-final

      - name: Test generic Lean portability adapters
        run: >-
          python3 -m unittest
          scripts.test_lean_portability
          scripts.test_lean_compiled_probe
          scripts.test_check_portability_rehearsal

      # Prover-loop registry hygiene: every OPEN target must have a stem on disk, else the
      # loop silently no-ops it. Foreign files (queue.json) are ignored.
      - name: Check prover target registry
        run: python3 scripts/check_targets.py

      # Fast, cheap gate: fail before building if any BUILT proof is left incomplete.
      # Scope: only *.lean files in the built proof base. Ecdlp/Targets/ holds open
      # conjecture stems (with `sorry`) that are intentionally NOT imported/built, so
      # they are excluded here. Restricting to *.lean avoids prose false-positives in
      # README/markdown files that legitimately discuss `sorry`.
      - name: Ensure no incomplete proofs remain (built proof base only)
        run: |
          # The AxiomAudit harnesses contain only `#print axioms` commands plus docs that
          # legitimately mention `sorryAx`; they contain no proofs and are not imported,
          # so exclude both to avoid a prose false-positive. The generated ledger audit's
          # `sorryAx` check is the robust no-sorry gate (scripts/check_axioms.py).
          if grep -rniI --include='*.lean' --exclude-dir=Targets --exclude='AxiomAudit.lean' --exclude='LedgerAxiomAudit.lean' 'sorry' Ecdlp.lean Ecdlp/ ResearchOS/ ResearchOS.lean; then
            echo "::error::Found 'sorry' in a built Lean file - a proof is incomplete"
            exit 1
          fi
          echo "All built proofs complete: no 'sorry' outside Ecdlp/Targets/ (Ecdlp.lean + Ecdlp/ + ResearchOS/ scanned)"

      # Close the latent hole: `sorry` is a warning, and the grep above skips Targets/.
      # If any BUILT file ever imported a Targets stem, a `sorry` could reach the build
      # graph undetected. Forbid `import Ecdlp.Targets` outside Targets/ itself.
      - name: Ensure no built file imports an open target stem
        run: |
          if grep -rnI --include='*.lean' --exclude-dir=Targets 'import Ecdlp.Targets' Ecdlp/; then
            echo "::error::A built Lean file imports Ecdlp.Targets (open stems carry 'sorry')"
            exit 1
          fi
          echo "No built file imports Ecdlp.Targets."

      # Cross-import guard (S0-TRUST): freeze the Ecdlp ↔ ResearchOS build-graph
      # separation that makes per-lane auditing meaningful. Only the audit
      # harnesses under Ecdlp/ (AxiomAudit.lean, LedgerAxiomAudit.lean — never
      # imported from Ecdlp.lean) may import both lanes; the isolation checker
      # pins that exact whitelist.
      - name: Ensure the Ecdlp and ResearchOS lanes do not cross-import
        run: |
          if grep -rnI --include='*.lean' --exclude='AxiomAudit.lean' --exclude='LedgerAxiomAudit.lean' 'import ResearchOS' Ecdlp.lean Ecdlp/; then
            echo "::error::A built Ecdlp file imports ResearchOS (lane separation violated)"
            exit 1
          fi
          if grep -rnI --include='*.lean' 'import Ecdlp' ResearchOS.lean ResearchOS/; then
            echo "::error::A ResearchOS file imports Ecdlp (lane separation violated)"
            exit 1
          fi
          echo "Lane separation holds: no Ecdlp↔ResearchOS cross-imports outside the ECDLP audit harness."

      # Only the bootstrap script source is pinned here; binary supply-chain
      # attestation is still a release-review obligation.
      - name: Install elan (Lean toolchain manager)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/0e36a07b9bbcc5381fa6250df109f9a4f94d7bac/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch prebuilt Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lean-ci-diagnostics"
          if lake exe cache get > "$RUNNER_TEMP/lean-ci-diagnostics/mathlib-cache.log" 2>&1; then
            tail -n 12 "$RUNNER_TEMP/lean-ci-diagnostics/mathlib-cache.log"
          else
            tail -n 80 "$RUNNER_TEMP/lean-ci-diagnostics/mathlib-cache.log"
            df -h
            exit 1
          fi

      # No restored project build cache is accepted as release evidence.
      # Dependency caches remain a disclosed upstream trust boundary.
      - name: Build both canonical proof libraries
        shell: bash
        run: |
          set -euo pipefail
          lake clean ecdlp
          if lake build > "$RUNNER_TEMP/lean-ci-diagnostics/lean-build.log" 2>&1; then
            tail -n 30 "$RUNNER_TEMP/lean-ci-diagnostics/lean-build.log"
          else
            tail -n 120 "$RUNNER_TEMP/lean-ci-diagnostics/lean-build.log"
            df -h
            exit 1
          fi

      # Trust gate: assert no built result depends on `sorryAx` or any axiom outside the
      # allowed base {propext, Classical.choice, Quot.sound, Lean.ofReduceBool}. This is
      # what makes the "no axioms" claim machine-enforced rather than just documented; it
      # also surfaces exactly which results extend the TCB via native_decide.
      - name: Axiom audit (no sorryAx, no custom axioms)
        run: |
          lake env lean Ecdlp/LedgerAxiomAudit.lean > axiom_audit.txt 2>&1 \
            || { echo "::error::axiom audit file failed to elaborate"; cat axiom_audit.txt; exit 1; }
          cat axiom_audit.txt
          python3 scripts/check_axioms.py axiom_audit.txt data/result_registry.json

      # ResearchOS lane audit (S0-TRUST): same exact-set check against the
      # ResearchOS registry, PLUS per-row declared axiom_base enforcement and
      # native-aux-axiom provenance (check_axioms per-row mode).
      - name: ResearchOS axiom audit (no sorryAx, no custom axioms, per-row base)
        run: |
          lake env lean ResearchOS/LedgerAxiomAudit.lean > researchos_axiom_audit.txt 2>&1 \
            || { echo "::error::ResearchOS axiom audit failed to elaborate"; cat researchos_axiom_audit.txt; exit 1; }
          cat researchos_axiom_audit.txt
          python3 scripts/check_axioms.py researchos_axiom_audit.txt data/researchos_result_registry.json

      - name: Verify isolated v0.2 proof candidates and exact controls
        run: python3 scripts/verify_v02.py --candidate-only

      # Open conjecture stems in Ecdlp/Targets/ are not part of the build graph. This
      # step typechecks them so the generator's output is at least well-formed Lean.
      # `sorry` is a warning (not an error), so a stem with `sorry` passes; a genuine
      # syntax/type error is surfaced as a warning here but never blocks the build.
      - name: Typecheck open target stems (non-blocking, sorry allowed)
        continue-on-error: true
        run: |
          shopt -s nullglob
          stems=(Ecdlp/Targets/*.lean)
          if [ ${#stems[@]} -eq 0 ]; then
            echo "No open target stems in Ecdlp/Targets/."
            exit 0
          fi
          for f in "${stems[@]}"; do
            echo "== lean typecheck: $f =="
            lake env lean "$f" || echo "::warning::stem failed to typecheck: $f"
          done

      # The per-push prover attempt was removed: it re-proved the already-verified
      # smoke target (targets/001, status=verified) on every push, spending model
      # attempts for no new information. The standalone dispatch workflow
      # (.github/workflows/prover-target-attempt.yml) remains for on-demand runs.

      - name: Record source-bound Lean diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lean-ci-diagnostics"
          { git rev-parse HEAD; df -h; } > "$RUNNER_TEMP/lean-ci-diagnostics/source-and-disk.txt"
          for log in axiom_audit.txt researchos_axiom_audit.txt; do
            if [ -f "$log" ]; then cp -- "$log" "$RUNNER_TEMP/lean-ci-diagnostics/$log"; fi
          done

      - name: Retain Lean diagnostics without source or credentials
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lean-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lean-ci-diagnostics/
          retention-days: 7
          if-no-files-found: error
