version: 2
status: accepted
scope: whole_repository
origin_branch: codex/research-os-truth-layer   # reviewed and merged to main; historical reference
purpose: >
  Classify repository artifacts by ownership and edit policy. Accepted and now
  partially enforced: `scripts/check_repo_artifacts.py` (a CI gate) checks the
  path classes and referenced files below stay consistent.
  Every repository file must match at least one class; overlaps require an
  explicit entry in allowed_overlap_paths.

principles:
  - lean_kernel_is_the_proof_authority
  - status_and_stats_are_canonical_for_live_counts
  - generated_artifacts_should_be_changed_through_generators
  - cleanup_is_classify_then_review_then_move_or_delete
  - public_claims_must_preserve_trust_boundaries
  - product_claims_and_mvp_boundaries_are_canonical

classes:
  kernel_verified_surface:
    description: Machine-checked Lean source and project build pins.
    paths:
      - Ecdlp.lean
      - Ecdlp/*.lean
      - Ecdlp/Proved/
      - ResearchOS.lean
      - ResearchOS/
      - lakefile.toml
      - lake-manifest.json
      - lean-toolchain
    owner: proof
    hand_edit: true
    generated: false
    gates:
      - lake build
      - no-sorry gate
      - axiom audit
    risks:
      - Moving files changes imports and review trails.
      - Adding axioms or sorry/admit destroys the central invariant.

  open_targets:
    description: Open conjecture stems and their target metadata.
    paths:
      - Ecdlp/Targets/
      - targets/
    owner: proof_generation
    hand_edit: true
    generated: mixed
    gates:
      - target stem review
      - generator consistency
    risks:
      - Open statements must not be imported into the proved surface.

  canonical_corpus:
    description: Vendored corpus plus curated traceability overlays.
    paths:
      - data/KG_CLAIM_FORMALIZATION_v1.csv
      - data/corpus_coverage_overrides.json
      - data/corpus_triage.json
      - data/corpus_reclassify.json
      - data/claim_traceability.jsonl
      - data/attack_registry.json
      - data/source_claim_extracts/
      - data/research_decisions.md
      - data/hypothesis_review_ledger.jsonl
      - data/README.md
    owner: frontier
    hand_edit: mixed
    generated: mixed
    gates:
      - checksum/provenance review for the CSV
      - frontier-map regeneration for overlays
    risks:
      - Reformatting the vendored CSV breaks provenance and checksums.

  verified_ledger_and_scope:
    description: Human-auditable theorem ledger and public trust boundaries.
    paths:
      - VERIFIED.md
      - VERIFIED_RESEARCHOS.md
      - TRUST_REPORT.md
      - ABSTRACT_SCOPE.md
      - BARRIERS.md
      - notes/SECURITY_SCOPE.md
    owner: publication_truth
    hand_edit: true
    generated: false
    gates:
      - scripts/gen_stats.py --check
      - scripts/check_counts.py
      - scripts/check_status_consistency.py
    risks:
      - Duplicate counts drift quickly.
      - Security wording can overclaim beyond the formal model.

  generated_views:
    description: Derived machine-readable and rendered views.
    paths:
      - data/stats.json
      - badges/theorems.json
      - STATUS.md
      - data/frontier_map.json
      - data/knowledge_graph.json
      - data/knowledge_graph.md
      - COVERAGE.md
      - index.html
      - dashboard.html
      - results.html
      - explore.html
      - pilot.html
      - robots.txt
      - sitemap.xml
      - bundles/MANIFEST.json
      - data/result_registry.json
      - data/source_registry.json
      - data/typed_evidence_state.json
      - data/research_claim_state.json
      - data/research_engine_state.json
      - data/research_engine_v02_state.json
      - data/research_engine_shadow_intake.json
      - data/untrusted_evidence_intake/
      - data/hypothesis_funnel_state.json
      - data/hypothesis_space_state.json
      - data/hypothesis_space_map.json
      - data/hypothesis_space_run_state.json
      - data/hypothesis_space_campaign_state.json
      - data/hypothesis_ranker_state.json
      - repo/ECDLP_DECISION_SUBSTRATE.md
      - Ecdlp/LedgerAxiomAudit.lean
      - data/researchos_result_registry.json
      - data/verified_index.json
      - VERIFIED_INDEX.md
      - llms.txt
      - results.html
      - ResearchOS/LedgerAxiomAudit.lean
    owner: generators
    hand_edit: false
    generated: true
    generators:
      - scripts/gen_stats.py
      - scripts/gen_status.py
      - scripts/build_frontier_map.py
      - scripts/build_knowledge_graph.py
      - scripts/coverage_report.py
      - scripts/build_dashboard.py
      - scripts/site_generator.py
      - scripts/export_agent_bundle.py
      - scripts/gen_result_registry.py
      - scripts/gen_source_registry.py
      - scripts/build_typed_evidence_state.py
      - scripts/research_claims.py
      - scripts/build_research_engine_state.py
      - scripts/build_research_engine_v02_state.py
      - scripts/build_research_shadow_intake.py
      - scripts/build_untrusted_evidence_intake.py
      - scripts/hypothesis_funnel.py
      - scripts/hypothesis_space_funnel.py
      - scripts/hypothesis_space_run_ledger.py
      - scripts/hypothesis_space_campaign.py
      - scripts/hypothesis_ranker.py
      - scripts/build_ecdlp_decision_view.py
      - scripts/gen_axiom_audit.py
      - scripts/gen_researchos_registry.py
      - scripts/gen_verified_index.py
    gates:
      - scripts/check_status_consistency.py
      - scripts/check_counts.py
      - scripts/check_repo_artifacts.py
      - scripts/export_agent_bundle.py --check
      - scripts/gen_result_registry.py --check
      - scripts/gen_researchos_registry.py --check
      - scripts/gen_verified_index.py --check
      - scripts/test_gen_verified_index.py
      - scripts/check_ledger_isolation.py
      - scripts/build_ecdlp_decision_view.py --check
      - scripts/build_research_engine_state.py --check
      - scripts/build_research_engine_v02_state.py --check
      - scripts/build_research_shadow_intake.py --check
      - scripts/build_untrusted_evidence_intake.py --check
      - scripts/hypothesis_funnel.py --check
      - scripts/test_hypothesis_funnel.py
      - scripts/hypothesis_space_funnel.py --check
      - scripts/test_hypothesis_space_funnel.py
      - scripts/hypothesis_space_run_ledger.py --check
      - scripts/test_hypothesis_space_run_ledger.py
      - scripts/hypothesis_space_campaign.py --check --replay
      - scripts/test_hypothesis_space_campaign.py
      - scripts/hypothesis_ranker.py --check
      - scripts/test_hypothesis_ranker.py
      - scripts/train_hypothesis_ranker.py --check-ready
      - scripts/test_train_hypothesis_ranker.py
      - scripts/build_typed_evidence_state.py --check
      - scripts/test_typed_evidence.py
      - scripts/test_research_claims.py
      - scripts/test_research_engine_v02.py
      - scripts/test_research_shadow_intake.py
      - scripts/test_untrusted_evidence_intake.py
      - scripts/check_research_engine_v02_acceptance.py
      - scripts/check_research_engine.py
      - scripts/check_product_model.py
    risks:
      - Hand edits create invisible drift unless encoded in generators.

  public_site:
    description: Public-facing static site surface and assets.
    paths:
      - index.html
      - dashboard.html
      - results.html
      - explore.html
      - pilot.html
      - robots.txt
      - sitemap.xml
      - assets/
      - fonts/
      - llms.txt
      - CNAME
    owner: site
    hand_edit: mixed
    generated: mixed
    gates:
      - public-site regeneration
      - status consistency check
      - product model check
      - link/counter review
    risks:
      - Site counters can become stale while proofs remain correct.
      - Product rhetoric can overstate reference-deployment capabilities or imply traction.

  research_os_control_plane:
    description: Files that orient low-context agents and hold active work.
    paths:
      - AGENTS.md
      - CLAUDE.md
      - AUTONOMY.md
      - README.md
      - ROADMAP.md
      - tasks/
      - experiments/HYPOTHESES.yaml
      - REPOSITORY_ARCHITECTURE.md
      - repo/ARTIFACTS.yaml
      - repo/CLEANUP_PLAN.md
      - repo/FORMAL_SUBSTRATE.json
      - repo/ECDLP_DECISION_SUBSTRATE.json
      - repo/RESEARCH_ENGINE_V0.json
      - repo/HYPOTHESIS_GENERATION_V0.json
      - repo/HYPOTHESIS_FUNNEL_V1.json
      - repo/HYPOTHESIS_SPACE_V2.json
      - repo/HYPOTHESIS_SPACE_RUN_LEDGER_V1.json
      - repo/HYPOTHESIS_SPACE_CAMPAIGN_V1.json
      - repo/HYPOTHESIS_RANKER_V0.json
      - repo/HYPOTHESIS_REVIEW_REGISTRY_V1.json
      - repo/HYPOTHESIS_MODEL_DRAFTER_V0.json
      - repo/HYPOTHESIS_SELECTION_CONSTITUTION_V3.md
      - repo/ECDLP_TYPED_EVIDENCE_V0.json
      - repo/RESEARCH_CLAIMS_V0.json
      - repo/RESEARCH_ENGINE_LIFECYCLE_V0.json
      - repo/RESEARCH_ENGINE_V0_2_ACCEPTANCE.json
      - repo/SCIENTIFIC_PROVENANCE_V0.json
      - repo/UNTRUSTED_EVIDENCE_INTAKE_V0.json
      - repo/PRODUCT_MODEL.json
      - repo/PILOT_PROTOCOL.json
      - repo/AUTOMATION_INVENTORY.json
      - repo/BRANCH_INVENTORY.json
      - repo/FINAL_REVIEW_PACKET.md
      - data/hyp_select_004_raw_100.tsv
      - models/hypothesis_ranker_v0/model.json
      - bundles/README.md
      - domains/
    owner: operations
    hand_edit: true
    generated: false
    gates:
      - scripts/check_status_consistency.py
      - scripts/check_repo_artifacts.py
      - scripts/check_automation_inventory.py
      - scripts/check_ecdlp_decision_substrate.py
      - scripts/check_research_engine.py
      - scripts/check_research_engine_v02_acceptance.py
      - scripts/check_scientific_semantics.py
      - scripts/check_product_model.py
      - scripts/check_domains.py
      - independent architecture review when available
    risks:
      - Too much prose can become another stale source of truth.

  automation_and_scripts:
    description: CI, generators, autonomous loops, server helpers, and prompts.
    paths:
      - .github/workflows/
      - .github/ISSUE_TEMPLATE/
      - scripts/
      - prompts/
      - requirements.txt
      - .gitignore
      - .gitattributes
    owner: automation
    hand_edit: true
    generated: false
    gates:
      - relevant script checks
      - GitHub Actions
      - py_compile for changed Python scripts
    risks:
      - Workflow names in docs can drift from actual workflow files.
      - Autonomous loops must remain draft/review gated.

  curated_research_notes:
    description: Durable research memory and publication planning.
    paths:
      - notes/*.md
      - notes/reviews/
      - docs/
      - PUBLISHABLE_UNITS.md
      - SETUP.md
    owner: research_memory
    hand_edit: true
    generated: false
    gates:
      - link review
      - count-drift checks where applicable
    risks:
      - Notes can preserve old claims after the formal state changes.

  archive:
    description: >
      Frozen history: superseded strategy docs (collapsed into ROADMAP.md), raw
      exploratory traces (ward, scratch), and the undeployed Phase-2 platform
      scaffold. Nothing here is a live surface; revive via git mv or a new repo.
    paths:
      - archive/docs/
      - archive/ward/
      - archive/scratch/
      - archive/platform/
      - archive/generator-report.md
      - archive/untrusted_intake/
    owner: history
    hand_edit: false
    generated: false
    gates:
      - content is frozen; changes belong in live surfaces, not here
    risks:
      - Archived prose can contain stale claims; nothing may cite it as current
        except with an explicit archive/ path.

  reproducible_experiments:
    description: Reproducible but non-kernel experimental code, manifests, and measured results.
    paths:
      - experiments/
    owner: experiments
    hand_edit: true
    generated: mixed
    gates:
      - experiment-specific validation scripts
      - hypotheses must authorize active work
    risks:
      - Measurements are evidence, never proofs or verified ECDLP claims.

  portability_rehearsal_control:
    description: >
      Canonical pre-pilot portability contract, execution record, and review
      packet. These are hand-reviewed internal technical controls, never
      customer discovery or external pilot evidence.
    paths:
      - repo/PORTABILITY_REHEARSAL.json
      - rehearsals/keyai-portability-001/baseline.json
      - notes/reviews/PORTABILITY_REHEARSAL_001.md
    owner: architecture_validation
    hand_edit: true
    generated: false
    gates:
      - scripts/check_portability_rehearsal.py
      - pinned external baseline outside ordinary KeyAI CI
    risks:
      - Execution records are attestations and must preserve negative attempts.
      - Internal rehearsal evidence must not enter external pilot or public surfaces.

  portability_rehearsal_generated:
    description: >
      Deterministic generated source inventory and compiled-environment trust
      probe for the pinned rehearsal source.
    paths:
      - rehearsals/keyai-portability-001/snapshot.json
      - rehearsals/keyai-portability-001/compiled-probe.json
    owner: architecture_validation
    hand_edit: false
    generated: true
    generators:
      - scripts/lean_portability.py
      - scripts/lean_compiled_probe.py
    gates:
      - scripts/check_portability_rehearsal.py
      - scripts/test_lean_portability.py
      - scripts/test_lean_compiled_probe.py
      - scripts/test_check_portability_rehearsal.py
      - pinned external baseline outside ordinary KeyAI CI
    risks:
      - Source-level inventory must not be presented as compiled proof evidence.
      - Internal rehearsal evidence must not enter the external pilot evidence log.
      - External source code must not be vendored or modified.
      - Compiler-trust dependencies must remain explicit.
      - Project-launched compiled output is not independently authenticated until the trusted-runner gap is closed.

allowed_overlap_paths:
  - index.html
  - dashboard.html
  - results.html
  - explore.html
  - pilot.html
  - robots.txt
  - sitemap.xml
  - llms.txt
  - Ecdlp/LedgerAxiomAudit.lean
  - ResearchOS/LedgerAxiomAudit.lean
  - experiments/HYPOTHESES.yaml
  - notes/SECURITY_SCOPE.md
  - notes/reviews/PORTABILITY_REHEARSAL_001.md

cleanup_candidates:
  - path: archive/
    proposed_action: review_retention_in_dedicated_audit
    priority: low
    reason: >
      Archived material is excluded from the canonical truth surface. Retain it
      through a dedicated retention audit, then remove only entries whose provenance and
      replacement are both documented.
    delete_now: false

# Executed 2026-07 (ROADMAP.md §4, tranche 1): notes/ward/ -> archive/ward/,
# scratch/ -> archive/scratch/, generator-report.md -> archive/,
# platform/ -> archive/platform/ (platform-ci.yml retired), and the superseded
# strategy/review docs -> archive/docs/.

deferred_actions:
  - id: archive-retention-review
    goal: Decide archive retention only in a dedicated inventory-first audit with reference scans and a restore path; do not delete during substrate or product normalization.
  - id: v01-tag
    goal: Tag v0.1 only after the integration PR merges and the full gate battery is green on main.

review_questions:
  - Which paths are misclassified?
  - Which cleanup candidates are actually still active?
  - Which generated artifacts lack a reliable generator or check?
  - Which public docs still duplicate canonical counts or stale workflow names?
  - Which deferred action would reduce the most future drift without erasing evidence?
